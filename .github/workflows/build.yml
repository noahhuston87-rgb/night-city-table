name: Build installers

# Every change pushed to "main" builds fresh installers and publishes them as a new release.
# Windows + Mac: the Rust (Tauri) app, small downloads.
# Linux: the Electron app, because Linux's built-in web engine can't be relied on for the
# peer-to-peer connections the game uses.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Set version
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Install tools
        run: npm install --no-save --ignore-scripts @tauri-apps/cli@2 peerjs@1.5.4
      - name: Bundle the connection library and make icons
        run: |
          node scripts/copy-peerjs.js
          npx tauri icon build/icon.png
      - name: Build the app
        run: npx tauri build ${{ matrix.args }}
      - name: Collect installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe "out/Night-City-Table-Setup-1.0.${{ github.run_number }}.exe"
      - name: Collect installer and check it is signed (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/Night-City-Table-1.0.${{ github.run_number }}-Mac.dmg"
          hdiutil attach out/*.dmg -mountpoint /tmp/nct -nobrowse
          APP=$(ls -d /tmp/nct/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -i "Signature=adhoc"
          lipo -archs "$APP/Contents/MacOS/"*
          hdiutil detach /tmp/nct
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: error
          path: out/*

  linux-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set version
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Install build tools
        run: npm install
      - name: Build installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          if-no-files-found: error
          path: dist/*.AppImage

  release:
    needs: [rust-app, linux-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Night City Table 1.0.${{ github.run_number }}
          make_latest: true
          files: out/*
          body: |
            ## Download Night City Table

            | Your computer | Download this |
            |---|---|
            | **Windows** | `Night-City-Table-Setup-1.0.${{ github.run_number }}.exe` |
            | **Mac** (any) | `Night-City-Table-1.0.${{ github.run_number }}-Mac.dmg` |
            | **Linux** | `Night-City-Table-1.0.${{ github.run_number }}-Linux.AppImage` |

            The files are under **Assets** below.

            **Windows:** if a blue "Windows protected your PC" box appears, click **More info → Run anyway**. That shows up because the app isn't from a paid, signed publisher.

            **Mac:** open the .dmg and drag Night City Table into Applications. The first time you open it, macOS says it can't verify the developer. Click **Done**, then go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. You only do this once.

            Your saved games are kept when you install a newer version.
