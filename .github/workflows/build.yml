name: Build installers

# Every change pushed to "main" builds fresh installers for Windows, Mac and Linux
# and publishes them as a new release. Friends always download from Releases → Latest.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set version
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Install build tools
        run: npm install
      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check the Mac app is signed
        if: runner.os == 'macOS'
        run: |
          hdiutil attach dist/*.dmg -mountpoint /tmp/nct -nobrowse
          codesign --verify --deep --strict --verbose=2 "/tmp/nct/Night City Table.app"
          codesign -dv "/tmp/nct/Night City Table.app" 2>&1 | grep -i "Signature=adhoc"
          lipo -archs "/tmp/nct/Night City Table.app/Contents/MacOS/Night City Table"
          hdiutil detach /tmp/nct
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Night City Table 1.0.${{ github.run_number }}
          make_latest: true
          files: out/*
          body: |
            ## Download Night City Table

            | Your computer | Download this |
            |---|---|
            | **Windows** | `Night-City-Table-Setup-1.0.${{ github.run_number }}.exe` |
            | **Mac** (any) | `Night-City-Table-1.0.${{ github.run_number }}-Mac.dmg` |
            | **Linux** | `Night-City-Table-1.0.${{ github.run_number }}-Linux.AppImage` |

            The files are under **Assets** below.

            **Windows:** if a blue "Windows protected your PC" box appears, click **More info → Run anyway**. That shows up because the app isn't from a paid, signed publisher.

            **Mac:** open the .dmg and drag Night City Table into Applications. The first time you open it, macOS says it can't verify the developer. Click **Done**, then go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. You only do this once.

            Your saved games are kept when you install a newer version.
